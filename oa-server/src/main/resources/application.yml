server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: yunshu-oa-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.yunshu.oa.entity
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

oa:
  jwt:
    secret: ${OA_JWT_SECRET:yunshu-oa-cloud-collab-2026-hmac-secret-please-change-in-prod}
    expire-hours: 12
  upload:
    dir: ${OA_UPLOAD_DIR:./data/uploads}

logging:
  level:
    root: info
    com.yunshu.oa: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n"
