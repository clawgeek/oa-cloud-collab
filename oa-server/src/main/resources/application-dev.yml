# 开发 / 演示 profile：内嵌 H2，零外部依赖，启动即建库并灌入演示数据
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:yunshuoa;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
